        document.getElementById('map-title').innerText = '📝 Netzknoten erfassen';
        document.getElementById('map-action-btn').innerText = 'Hier erfassen';
    } else {
        document.getElementById('map-title').innerText = '📍 KM auf Karte erfassen';
        document.getElementById('map-action-btn').innerText = 'KM übernehmen';
    }
    let initLat = letzteLat !== 0 ? letzteLat : 51.3;
    let initLon = letzteLon !== 0 ? letzteLon : 6.85;
    if (!map) {
        map = L.map('karte', { zoomControl: false }).setView([initLat, initLon], 18);
        let osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 22 });
        let satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 22 });
        osmLayer.addTo(map);
        L.control.layers({ "Standard Karte": osmLayer, "Satellit": satLayer }).addTo(map);
    } else {
        map.setView([initLat, initLon], 18);
    }
    setTimeout(() => map.invalidateSize(), 200);
    if (letzteLat === 0 && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 18);
        }, () => {}, { timeout: 5000 });
    }
}

function closeMap() {
    document.getElementById('map-overlay').style.display = 'none';
    if (mapLineLayer) { map.removeLayer(mapLineLayer); mapLineLayer = null; }
}

function calculateMapResult() {
    let pos = map.getCenter(); 
    let ptPin = turf.point([pos.lng, pos.lat]);
    let maxDist = 0.25;
    let priorisiereAutobahn = mapMode === 'KM';
    let kandidaten = findeKandidatenFuerPin(ptPin, maxDist, priorisiereAutobahn);
    let sel = mapMode === 'NK'
        ? waehleKandidatMitFokus(ptPin, kandidaten, manuellerFokus, 0.03)
        : waehleKandidatMitFokus(ptPin, kandidaten, manuellerFokus, 0.12);

    let resDiv = document.getElementById('nk-map-result');
    if (mapLineLayer) map.removeLayer(mapLineLayer);
 
    if(sel) {
        let props = sel.feature.properties || {};
        let strName = sel.name;
        let achse = normalisiereAchse(props.Sk_Achse);
        let alleImUmkreis = findeSegmenteFuerKarte(ptPin, maxDist);
        
        let rDrop = document.getElementById("richtung");
        if (rDrop && Array.from(rDrop.options).some(o => o.value === achse)) {
            rDrop.value = achse;
        }

        if (mapMode === 'NK') {
            let snapped = turf.nearestPointOnLine(sel.feature, ptPin, {units: 'meters'});
            let distAufLinieMeter = snapped.properties.location || 0;
            let snappedCoord = turf.getCoord(snapped);
            
            aktiveLat = snappedCoord[1];
            aktiveLon = snappedCoord[0];
            
            mapLineLayer = L.layerGroup().addTo(map);
           alleImUmkreis.forEach(feat => { if(feat !== sel.feature) L.geoJSON(feat, { style: { color: '#dc3545', weight: 2.5, opacity: 0.6 } }).addTo(mapLineLayer); });
           L.geoJSON(sel.feature, { style: { color: '#28a745', weight: 3.5, opacity: 0.9 } }).addTo(mapLineLayer);
            
            let htmlZettel = holeNKHtml(props, distAufLinieMeter, strName); 
           resDiv.innerHTML = `<div class="nk-box" style="margin-top:0; padding:8px;">${htmlZettel}</div>`;
           resDiv.style.display = 'block';
            setTimeout(() => { 
               map.invalidateSize(); 
               map.setView([snappedCoord[1], snappedCoord[0]], map.getZoom(), {animate: false});
            }, 20);
        } 
        else if (mapMode === 'KM') {
            let bkm = 0;
            
            if (strName.startsWith("A")) {
                bkm = berechneGoldgriffBKM(ptPin, strName);
                aktiveKM = bkm;
            } else {
                aktiveKM = 0;
            }
            
            let needsSwitch = true;
            let currentGrenzen = datenWachen[aktuelleWache].grenzen[strName];
            if (currentGrenzen && bkm >= Math.min(...currentGrenzen) && bkm <= Math.max(...currentGrenzen)) needsSwitch = false; 
            
            if (needsSwitch && bkm > 0) {
                let zielWache = findeWacheFuerAutobahnKm(strName, bkm, ptPin);
                if (zielWache && zielWache !== aktuelleWache) wechsleWache(zielWache, true, strName, true);
            }
            
            let drop = document.getElementById("autobahn");
            let isOnCurrentWache = strName.startsWith("A") && Array.from(drop.options).some(o=>o.value===strName);

            if (strName.startsWith("A") && bkm > 0) {
                let selectedRichtung = document.getElementById("richtung").value;
                let gemeindeAchse = selectedRichtung || achse;
                setzeGemeindeAnzeige(strName, bkm, gemeindeAchse);
                setzeMeistereiAnzeige(strName, bkm);
                aktiveStrasse = strName;
                aktiveAchse = gemeindeAchse;
                aktiveKM = bkm;
                document.getElementById("km").value = bkm.toFixed(3).replace('.',',');
                let posPin = ermittleFahrbahnPosition(strName, bkm, gemeindeAchse);
                if (posPin && posPin.coords) {
                    aktiveLat = posPin.coords[1];
                    aktiveLon = posPin.coords[0];
                }
            } else if (!strName.startsWith("A")) {
                anwendenLbErgebnis(strName, sel.feature, ptPin);
                manuellerFokus = strName;
                closeMap();
                return;
            }
            
            if (isOnCurrentWache) {
                drop.value = strName;
                manuellerFokus = strName;
                let wachenGrenzenNeu = datenWachen[aktuelleWache].grenzen;
                if(wachenGrenzenNeu[strName] && bkm > 0) {
                    let percent = ((bkm - wachenGrenzenNeu[strName][0]) / (wachenGrenzenNeu[strName][1] - wachenGrenzenNeu[strName][0])) * 100;
                    document.getElementById("progress").style.width = Math.max(0, Math.min(100, percent)) + "%";
                } else {
                    document.getElementById("progress").style.width = "0%";
                }
                updateUI();
            } else if (strName.startsWith("A")) {
                document.getElementById("progress").style.width = "0%";
            }

            if (strName.startsWith("A")) {
                let dirText = "";
                let rfListe = datenWachen[aktuelleWache].richtungen[strName]; 
                if (achse === 'Hauptachse') dirText = rfListe ? rfListe[0] : "(+)";
                else if (achse === 'Nebenachse') dirText = rfListe ? rfListe[1] : "(-)";
                else if (achse === 'Bestandsachse') dirText = "Bestandsachse";

                let bkmAnzeige = bkm > 0 ? bkm.toFixed(3).replace('.',',') : "-";
                if (dirText) bkmAnzeige += ` | <strong>${dirText}</strong>`;
                bkmAnzeige += holeRegionHint(strName, bkm, ptPin);
                let farbe = isOnCurrentWache ? 'green' : 'orange';
                let icon = isOnCurrentWache ? '✅' : '⚠️';
                document.getElementById("erfasste-strasse").innerHTML = `<span style="color:${farbe};font-weight:bold;">${icon} ${strName}</span> | BKM: ${bkmAnzeige}`;
                manuellerFokus = strName;
                if (bkm > 0) {
                    letzteKontextMeta = { snapDistM: Math.round(sel.dist * 1000), gpsAccM: 0, rfApproximiert: false, manuell: false };
                    aktualisiereKontextAnzeigen({ strName: strName, km: bkm, achse: document.getElementById("richtung").value || achse, pt: ptPin, snapDistM: letzteKontextMeta.snapDistM, manuell: false });
                }
            }
            closeMap();
        }
    } else {
       resDiv.innerHTML = `<p style="color:red; margin:0;">Keine Straße im 250m Umkreis gefunden.</p>`;
       resDiv.style.display = 'block';
       setTimeout(() => { map.invalidateSize(); }, 20);
    }
}

// --- WEG ZEIT RECHNER FUNKTIONEN ---
function toggleSpeedMode() {
    let mode = document.querySelector('input[name="speed_mode"]:checked').value;
    if(mode === 'live') {
       alert("Hinweis: Echte Google Maps Live-Verkehrsdaten erfordern eine kostenpflichtige API.");
       document.getElementById('speed').value = "120";
       document.getElementById('speed').disabled = true;
    } else {
       document.getElementById('speed').value = "";
       document.getElementById('speed').disabled = false;
    }
}
 
function updateWzUI() {
    let a = document.getElementById("wz_autobahn").value;
    if(!a) return;
    let wachenRichtungen = datenWachen[aktuelleWache].richtungen;
    let wachenListen = datenWachen[aktuelleWache].listen || {};
    let sel = document.getElementById("wz_richtung");
    sel.innerHTML = "";
   if(wachenRichtungen[a]) wachenRichtungen[a].forEach(r => sel.add(new Option(r, r)));
    
    let tbody = document.getElementById("wz_liste");
    tbody.innerHTML = "";
   if(wachenListen[a]) {
       wachenListen[a].forEach(e => {
            let tr = document.createElement("tr");
           tr.innerHTML = `<td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td>`;
           tbody.appendChild(tr);
        });
    }
}
 
function startWegZeit() {
    wzStartKm = parseFloat(document.getElementById("start_km").value.replace(',','.'));
    wzSpeed = parseFloat(document.getElementById("speed").value);
    let dirStr = document.getElementById("wz_richtung").value;
    let delayStr = document.getElementById("wz_delay").value.replace(',','.');
    let delayMin = parseFloat(delayStr) || 0;
    
   if(isNaN(wzStartKm) || isNaN(wzSpeed)) { alert("Bitte Start-KM und Geschwindigkeit eingeben."); return; }
    
    wzDir = dirStr.includes("(+)") ? 1 : -1;
    let delayMs = delayMin * 60 * 1000;
    wzStartTime = Date.now() - delayMs;
    
   document.getElementById("btn_wz_start").style.display = "none";
   document.getElementById("btn_wz_stop").style.display = "block";
   document.getElementById("wz_result_box").style.display = "block";
    
   document.getElementById("wz_autobahn").disabled = true;
   document.getElementById("wz_richtung").disabled = true;
   document.getElementById("start_km").disabled = true;
   document.getElementById("wz_delay").disabled = true;
   document.getElementById("speed").disabled = true;
   document.querySelectorAll('input[name="speed_mode"]').forEach(r => r.disabled = true);
    
    if(wzInterval) clearInterval(wzInterval);
    wzInterval = setInterval(tickWegZeit, 1000);
    tickWegZeit(); 
}
 
function stopWegZeit() {
    if(wzInterval) clearInterval(wzInterval);
   document.getElementById("btn_wz_start").style.display = "block";
   document.getElementById("btn_wz_stop").style.display = "none";
   document.getElementById("wz_autobahn").disabled = false;
   document.getElementById("wz_richtung").disabled = false;
   document.getElementById("start_km").disabled = false;
   document.getElementById("wz_delay").disabled = false;
    let mode = document.querySelector('input[name="speed_mode"]:checked').value;
    if(mode === 'manual') document.getElementById("speed").disabled = false;
   document.querySelectorAll('input[name="speed_mode"]').forEach(r => r.disabled = false);
   document.getElementById("wz_ankunft").innerText = "-";
}
 
function findeNaechsteAsWz(currentKm) {
    let a = document.getElementById("wz_autobahn").value;
    if (!a) return null;
    let best = null;
    holeListenEintraegeMitKm(a).forEach(e => {
        if (!istInfraTyp(e.typ)) return;
        let diff = (e.km - currentKm) * wzDir;
        if (diff > 0.05 && (!best || diff < best.diff)) best = Object.assign({}, e, { diff: diff });
    });
    return best;
}

function tickWegZeit() {
    let elapsedMs = Date.now() - wzStartTime;
    let elapsedHours = elapsedMs / (1000 * 60 * 60);
    let elapsedMin = Math.floor(elapsedMs / (1000 * 60));
    let elapsedSec = Math.floor((elapsedMs / 1000) % 60);
    let currentKm = wzStartKm + (wzDir * (wzSpeed * elapsedHours));
   document.getElementById("wz_aktuell_km").innerText = currentKm.toFixed(3).replace('.',',');
   document.getElementById("wz_zeit").innerText = `${elapsedMin}:${elapsedSec.toString().padStart(2, '0')}`;
   highlightWzList(currentKm);
    let naechste = findeNaechsteAsWz(currentKm);
    let ankunftEl = document.getElementById("wz_ankunft");
    if (ankunftEl) {
        if (naechste && wzSpeed > 0) {
            let min = (naechste.diff / wzSpeed) * 60;
            ankunftEl.innerText = naechste.typ + " " + naechste.name + " in ca. " + Math.round(min) + " min (km " + naechste.kmText + ", " + naechste.diff.toFixed(1).replace(".", ",") + " km voraus)";
        } else {
            ankunftEl.innerText = "-";
        }
    }
}
 
function highlightWzList(currentKm) {
    let rows = document.querySelectorAll("#wz_liste tr");
    let closestRow = null;
    let minDiff = Infinity;
    rows.forEach(row => {
       row.classList.remove('wz-highlight');
        let kmCell = row.cells[2].innerText;
        let rowKm = parseFloat(kmCell.replace(',', '.'));
       if(!isNaN(rowKm)) {
            let diff = Math.abs(currentKm - rowKm);
            if(diff < minDiff) { minDiff = diff; closestRow = row; }
        }
    });
    if(closestRow) closestRow.classList.add('wz-highlight');
}

    let btn = ev.target.closest('.gps-wechsel-btn');
    if (btn && btn.dataset.str) wechsleFokus(btn.dataset.str);
});
